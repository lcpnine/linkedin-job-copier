<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LinkedIn Job Copier</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header__logo">
        <img src="icons/icon48.png" alt="" width="32" height="32" />
      </div>
      <div class="header__text">
        <h1 class="header__title">Job Copier</h1>
        <p class="header__sub">LinkedIn · <span id="statusDot" class="status-dot status-dot--detecting">detecting…</span></p>
      </div>
    </header>

    <!-- Shown when the tab is not on job search results -->
    <div id="goToSearch" class="state-msg" hidden>
      <button id="goToPreferencesBtn" type="button" class="btn btn--outline" data-section="preferences">Jobs based on your preferences →</button>
      <button id="goToProfileBtn" type="button" class="btn btn--outline" data-section="profile">Jobs that match your profile →</button>
    </div>

    <!-- Main content (shown on linkedin.com/jobs/search-results) -->
    <div id="mainContent" hidden>
      <!-- Job List Section -->
      <section class="section">
        <div class="section__head">
          <span class="section__label">Jobs by Page</span>
        </div>

        <form id="pageRangeForm" class="page-range">
          <label for="fromPageInput">Pages</label>
          <input id="fromPageInput" type="number" min="1" max="100" step="1" value="1" required />
          <span>to</span>
          <input id="toPageInput" type="number" min="1" max="100" step="1" value="1" required />
          <button id="scrapeListBtn" type="submit" class="btn btn--sm btn--primary">Extract Jobs</button>
        </form>

        <div id="jobListState" class="list-empty">
          <p>Enter the pages of search results to go through, then click Extract Jobs.</p>
        </div>
        <p id="extractionResult" class="list-empty" role="status" aria-live="polite" hidden></p>

        <div id="jobList" class="job-list" hidden></div>

        <div id="listActions" class="btn-row" hidden>
          <button id="copyAllBtn" class="btn btn--primary btn--sm">📋 Copy All as Text</button>
          <button id="exportCsvBtn" class="btn btn--ghost btn--sm">⬇ Export CSV</button>
        </div>
      </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span id="extensionVersion"></span> · Works on Chromium browsers · Brave · Edge · Arc
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
